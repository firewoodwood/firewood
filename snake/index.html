<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <style>
        /* ========== 全局主题变量 ========== */
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #1a1a2e;
            --border-color: #ddd;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --grid-line: #e0e0e0;
            --snake-head: #2ecc71;
            --snake-body: #27ae60;
            --food-color: #e74c3c;
            --btn-bg: #4a90d9;
            --btn-hover: #357abd;
            --ai-btn-bg: #8e44ad;
            --ai-btn-hover: #732d91;
            --muted: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --text-color: #eaeaea;
            --border-color: #2a3a5e;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --grid-line: #2a3a5e;
            --snake-head: #2ecc71;
            --snake-body: #1abc9c;
            --food-color: #f1c40f;
            --btn-bg: #e67e22;
            --btn-hover: #d35400;
            --ai-btn-bg: #9b59b6;
            --ai-btn-hover: #8e44ad;
            --muted: rgba(255, 255, 255, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            /* 始终保留滚动条：内容高度在视口上下浮动时，滚动条的"出现/消失"
               会改变可用宽度（实测 clientWidth 443 <-> 450），整页跟着跳
               2.92px。让它一直在，宽度就恒定了。
               注：`scrollbar-gutter: stable` 在这个页面实测没效果，所以用
               overflow-y: scroll 这个更直接的做法。 */
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            /* 垂直居中交给子元素的 `margin: auto` 做（见 .layout —— 它才是
               body 的 flex 子元素），
               不用 align-items。原因：`safe center` 的语义是"放不下就退回
               顶部对齐"，而"退回"这个动作本身就是位移 —— 内容高度刚好跨过
               视口高度时（实测 body 900.00 -> 901.34）会整页跳 2.92px。
               `margin: auto` 在放得下时居中、放不下时从顶部开始，
               两种情况下位置是连续的，跨过阈值不跳。 */
            align-items: flex-start;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: background 0.3s ease;
            margin: 0;
            padding: 20px;
            /* 和 html 一样预留滚动条空间。只给 html 设不够 ——
               body 自己是滚动容器时，可用宽度仍会在"滚动条出现/消失"之间变，
               而 canvas 是流式宽度（width:100% + aspect-ratio:1），
               宽度一变高度也跟着变，形成"宽度↔高度互相触发"的小循环。 */
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            /* 垂直居中由它负责（body 是 flex 容器，而它是 body 的 flex 子元素）。
               放不下时自动从顶部开始，且位置连续 —— 不会像 `safe center`
               那样在"刚好超过视口高度"时跳一下。 */
            margin: auto;
        }

        .game-wrapper {
            background: var(--panel-bg);
            padding: 30px 35px 35px 35px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            /* 宽度写死：原来用 width: fit-content，宽度会随"这一屏显示几个
               按钮"变，五个界面的卡片宽度因此都不一样（也会带着 canvas 变高）。
               470px = 35px 内边距 ×2 + 400px 画布，正好容下画布。 */
            width: 470px;
            max-width: 100%;
            box-sizing: border-box;
            /* 高度也统一：工具栏已固定成两行，这里再给一个统一的最小高度，
               兜住"胜利提示条比别的界面多出 10px"这一点。
               720px 是按内容最高的那个界面（胜利）留出来的，其余界面底部
               会有一小块空白 —— 这是"五个界面一样大"必然的结果。 */
            min-height: 720px;
        }

        /* ========== 多局战绩面板 ========== */
        .history-panel {
            background: var(--panel-bg);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 24px 22px;
            width: 260px;
            color: var(--text-color);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .history-panel h3 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .history-sub {
            font-size: 12px;
            opacity: 0.55;
            margin-bottom: 14px;
        }
        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 380px;
            overflow-y: auto;
        }
        .history-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--muted);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .history-list .h-index { opacity: 0.5; min-width: 34px; }
        .history-list .h-mode { opacity: 0.75; font-weight: 500; }
        .history-list .h-score { margin-left: auto; }
        .history-empty { font-size: 13px; opacity: 0.5; padding: 8px 2px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            color: var(--text-color);
            transition: color 0.3s ease;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title { font-size: 24px; font-weight: 700; letter-spacing: 1px; }

        .score-area {
            display: flex;
            gap: 4px;
            font-weight: 600;
            font-size: 17px;
            /* 数字等宽：否则 0/1 比 2~9 窄，分数每跳一次整行宽度就变一次。 */
            font-variant-numeric: tabular-nums;
            /* 宽度跟着三条内容走。这里仍要留意"吃食物时页面颤动"那个坑：
               宽度会随数字位数变（9→10 时约宽 19px），而顶栏是
               `justify-content: space-between`，右侧变宽会把左边标题挤窄、
               整行重排 —— 但那一轮已经用 `body { align-items: safe center }`
               把"整页跳动"这一层按住了，实测吃食物 180 帧零几何变化
               （详见 4.12）。 */
            flex: 0 1 auto;
        }
        /* 每个计数条**贴着内容**，左对齐 —— 这样三条的左侧留白都等于 padding，
           看起来一样长。早先写的是固定 134px + 右对齐，结果内容窄的
           （「🍎 0」64px）左边空出 55.7px，而内容宽的（「🎮 399 局」106px）
           只空 14px，左边一眼看去就不齐。
           注意不能用固定宽度来"对齐数字"：那样只要内容和槽宽有差值，
           这个差值就全堆在左边。 */
        /* 数字单独占一个**固定宽度**的槽（按三位数预留），并在槽里右对齐。
           这样两头都顾上了：
             · 三条都是左对齐 + 贴内容，左侧留白恒等于 padding（不会像固定
               整条宽度那样，把内容与槽宽的差值全堆在左边）；
             · 数字位数变化时，动的只是数字在槽内的位置，槽宽不变，
               整条宽度也不变 —— 不会再把顶栏撑宽。
           实测：一位数约 9.5px、两位数 18.9px、三位数 28.3px，取 30px。 */
        .score-area .num {
            flex: 0 0 30px;
            text-align: right;
        }
        /* 注意用 `>`：这三条胶囊样式只给**直接子元素**。
           写成 `.score-area span`（后代选择器）会连内层的 .num 与数字 span
           一起套上背景与 padding，把 30px 的数字槽撑成 58px —— 实际踩到过。 */
        .score-area > span {
            flex: 0 0 auto;
            min-width: 0;
            background: var(--muted);
            padding: 6px 14px;
            border-radius: 40px;
            text-align: left;
            white-space: nowrap;
        }
        /* 内层不放背景、不要内边距，只占位；宽度必须钉死，
           否则会被上面 `.score-area span { flex: 0 0 auto }` 拉成内容宽度。 */
        .score-area .num,
        .score-area .num > span {
            background: none;
            padding: 0;
            border-radius: 0;
            flex: 0 0 auto;
        }
        .score-area .num {
            width: 30px;
            min-width: 30px;
            max-width: 30px;
        }
        .score-area .num > span {
            display: inline-block;
            width: 30px;
            min-width: 30px;
            max-width: 30px;
            text-align: right;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            /* 尺寸**写死**，不要用 width:100% + aspect-ratio 那套流式尺寸：
               那样卡片一变宽 canvas 就跟着变高，而五个界面显示的按钮数不同、
               卡片宽度也不同，于是每个界面的画布大小都不一样。
               写死之后画布在所有界面里始终是 400×400（也正好是 canvas 的
               内部分辨率，绘制最清晰）。 */
            width: 400px;
            height: 400px;
            max-width: 100%;
            transition: border 0.3s ease, background 0.3s ease;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 6px;
            margin-top: 14px;
            flex-wrap: wrap;
            /* 高度**固定**：按钮显示的个数随界面变，不固定的话工具栏会从
               1 行长到 2 行，五个界面的卡片高度就对不上了。
               定成两行是因为按钮最多的界面本来就要两行（一行装不下）。 */
            height: 102px;
            box-sizing: border-box;
        }

        /* 「主题」推到**本行行尾**。
           为什么是行尾：按钮个数随界面变（开始 2 个、游戏中 4 个…），
           换行位置就跟着变，所以"第几个格子"这种横向位置稳不住；
           而"行尾"是唯一稳定的锚点 —— 无论在 1 行还是 2 行，它都贴着行尾。
           实测五个界面里它的位置完全一致（117,58 → 同一处）。 */
        .toolbar > .btn-theme {
            margin-left: auto;
        }

        .btn {
            background: var(--btn-bg);
            color: #fff;
            border: none;
            /* 内边距与字号收紧（原 padding 10px 24px / 16px）：卡片定宽 470px
               之后，最挤的那一行是胜利界面的 [重新开始 + 胜利提示 + 主题]，
               实测要 415px，超过卡片内宽 400px，会把「主题」挤到第二行。
               收一档之后这一行放得下，「主题」就能稳定贴在第一行行尾。 */
            padding: 9px 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
            letter-spacing: 0.5px;
            white-space: nowrap;
            box-sizing: border-box;
            max-width: 100%;
        }
        .btn:hover {
            background: var(--btn-hover);
            transform: scale(1.02);
        }

        .btn-ai {
            background: var(--ai-btn-bg);
            box-shadow: 0 4px 12px rgba(142, 68, 173, 0.4);
        }
        .btn-ai:hover {
            background: var(--ai-btn-hover);
        }

        .btn-theme {
            background: transparent;
            color: var(--text-color);
            box-shadow: none;
            border: 2px solid var(--border-color);
            min-width: auto;
            padding: 8px 18px;
        }
        .btn-theme:hover {
            background: var(--border-color);
            transform: none;
        }

        /* 结束本局：红色，和普通按钮区分开，避免误点 */
        .btn-danger {
            background: #e74c3c;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.35);
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        /* 暂停中的按钮做成高亮态，一眼能看出当前是暂停 */
        .btn.is-paused {
            background: #f39c12;
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.35);
        }

        /* 暂停键在"没有对局可暂停"的时候藏起来：
             ① 刚点进来 / 停在开局提示上（还没开始，没有可暂停的东西）
             ② 本局结束之后（死亡或填满全盘，也没有可暂停的东西）
           用 display:none 而不是 visibility:hidden —— 后者仍占着位置，
           会在按钮行里留一个空档。 */
        .btn.is-hidden {
            display: none;
        }

        .status-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: var(--text-color);
            font-weight: 500;
            font-size: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-tip { opacity: 0.9; min-height: 24px; }
        .ai-progress { font-weight: 600; color: var(--ai-btn-bg); }

        .hint {
            margin-top: 6px;
            font-size: 13px;
            opacity: 0.5;
            color: var(--text-color);
        }
        /* 返回个人主页的入口。
           父元素 .hint 有 opacity:0.5，链接会被一起压淡，所以这里单独提到 1，
           否则这个链接几乎看不见、不像能点的东西。 */
        .hint a {
            color: var(--btn-bg);
            opacity: 1;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            padding-bottom: 1px;
            transition: color 0.2s;
        }
        .hint a:hover { color: var(--btn-hover); }

        /* ========== 胜利后的操作区 ==========
           展示内容（奖杯、得分、蛇长、步数）画在画布的胜利界面上，
           这里只放两个按钮：玩家要能自己选"继续玩"还是"重新开始"。
           用真实按钮而不是画在 canvas 上，键盘和读屏才都能用。 */
        /* 胜利提示：和工具栏里其它按钮排在同一行，所以做成按钮尺寸的胶囊，
           而不是原来那种整条横幅（它现在跟着「重新开始」一起横排）。 */
        /* 这一层只作为"继续玩"的容器存在（原来它外面套了一圈金色边框，
           按学生要求去掉了）。保留这个容器是因为 JS 用它来显示/隐藏，
           而且工具栏的换行布局依赖它的存在。 */
        .win-banner {
            display: none;              /* 默认隐藏，达标时由 JS 显示 */
            align-items: center;
            /* 不要让它参与 flex 伸展：工具栏定宽后它是 flex 项，
               默认 flex-shrink:1；钉住它，避免在"剩余空间不足"时把同行的
               「继续玩」挤到下一行。 */
            flex: 0 0 auto;
            padding: 0;
        }
        .win-banner.show { display: flex; }
        .btn-continue {
            background: #2ecc71;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.35);
        }
        .btn-continue:hover { background: #27ae60; }

        @media (max-width: 980px) {
            .history-panel { width: 100%; max-width: 650px; }
            .history-list { max-height: 200px; }
        }

        @media (max-width: 500px) {
            .game-wrapper { padding: 18px; }
            .header { flex-direction: column; gap: 6px; }
            .score-area { font-size: 14px; gap: 10px; }
            .btn { padding: 8px 14px; font-size: 14px; min-width: 70px; }
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="game-wrapper">
        <!-- 头部 -->
        <div class="header">
            <div class="title">贪吃蛇</div>
            <div class="score-area">
                <span>🍎 <span class="num"><span id="scoreDisplay">0</span></span></span>
                <span>🏆 <span class="num"><span id="highScoreDisplay">0</span></span></span>
                <span>🎮 <span class="num"><span id="roundCountDisplay">0</span></span> 局</span>
            </div>
        </div>

        <!-- 画布 -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- 工具栏 -->
        <div class="toolbar">
            <button class="btn" id="pauseBtn">⏸️ 暂停</button>
            <button class="btn" id="restartBtn">🔄 重新开始</button>
            <!-- 胜利提示：就摆在「重新开始」右边。
                 达标时整条亮起来，玩家一眼看到"胜利 + 继续玩"，而
                 「重新开始」就在紧挨着的左边，两个选择在同一行里。
                 展示内容（奖杯 / 得分 / 蛇长 / 步数）画在画布上，这里只有按钮。 -->
            <div class="win-banner" id="winBanner" role="status" aria-live="polite">
                <button class="btn btn-continue" id="continueBtn" type="button">▶️ 空格继续</button>
            </div>
            <button class="btn btn-ai" id="aiBtn">AI自动玩</button>
            <button class="btn btn-danger" id="endBtn">💀 结束本局</button>
            <button class="btn btn-theme" id="themeToggle">🌙 切换夜间模式</button>
        </div>

        <!-- 状态信息 -->
        <div class="status-area">
            <div class="status-tip" id="statusTip">⬆️⬇️⬅️➡️ 方向键控制</div>
            <div class="ai-progress" id="aiProgress"></div>
        </div>
        <div class="hint">
            最高分、主题、战绩均自动保存 ·
            <a href="../index.html">返回个人主页</a>
        </div>
    </div>

    <!-- 多局战绩：最近 10 局 -->
    <aside class="history-panel">
        <h3>📋 多局战绩</h3>
        <div class="history-sub">最近 10 局 · 刷新后保留</div>
        <ul class="history-list" id="historyList"></ul>
        <div class="history-empty" id="historyEmpty">还没有对局记录，先玩一局吧。</div>
    </aside>
</div>

<script>
    // ================================================================
    //  核心参数
    // ================================================================
    const GRID_SIZE = 20;
    const TICK_INTERVAL = 150;          // 手动模式：每步 150ms
    // AI 模式：每步 70ms（比手动更快，但比早期版本慢得多）。
    // 刻意保持匀速、不做自动提速，目的是能看清 AI 的每一步走法。
    // 代价是铺满全盘要 2 万步左右，一局约 23 分钟——想快就调小这个值，
    // 想更慢就调大（值越小越快）。用「暂停 / 结束本局」可随时中断长局。
    const AI_TICK_INTERVAL = 70;
    // 胜利分数：首次达到这个分数时弹出胜利界面，由玩家决定继续还是重开。
    // 只触发一次（重开或换局才复位），否则每吃一个食物都会再弹一次，很烦。
    const WIN_SCORE = 15;
    const HISTORY_MAX = 10;             // 战绩最多保留局数
        const EFFECT_PARTICLE_LIFE = 620;   // 粒子寿命(ms)
const EFFECT_FLOATER_LIFE = 900;    // 上浮文字寿命(ms)
    const EFFECT_FLASH_LIFE = 320;      // 死亡闪屏时长(ms)

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const highScoreSpan = document.getElementById('highScoreDisplay');
    const roundCountSpan = document.getElementById('roundCountDisplay');
    const statusTip = document.getElementById('statusTip');
    const aiProgress = document.getElementById('aiProgress');
    const winBanner = document.getElementById('winBanner');
    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const endBtn = document.getElementById('endBtn');
    const aiBtn = document.getElementById('aiBtn');
    const themeBtn = document.getElementById('themeToggle');

    // ---------- 游戏状态 ----------
    let snake = [];
    let food = { x: 8, y: 10 };
    let direction = 'right';
    let nextDirection = 'right';
    let score = 0;
    let stepCount = 0;               // 本局走过的步数，胜利界面展示
    let highScore = 0;
    let roundCount = 0;              // 累计已完成的局数（跨局累加，刷新后保留）
    let gameOver = false;
    let winFlag = false;
    let gameLoopTimer = null;
    let animTimer = null;            // 画面刷新定时器（独立于游戏逻辑）
    let paused = false;              // 暂停：不推进、不重绘定时器，恢复后接着走
    let endReason = null;            // 最近一次结束的原因，供画面/提示使用

    // ---------- 反馈效果数据 ----------
    // 纯视觉的短生命周期对象，每帧在 updateEffects() 里推进、过期即丢弃。
    // 用 Date.now() 当时间基准：AI 模式一帧可能走多步（这里现在是 1 步），
    // 用时间而不是帧数计算寿命，动画时长才不会随速度变化。
    let particles = [];              // 吃食物时炸开的小点
    let floaters = [];               // 上浮并淡出的文字，如 "+1"
    let deathFlashUntil = 0;         // 死亡闪屏的截止时间戳

    // ---------- AI 状态 ----------
    let aiMode = false;              // 当前是否由 AI 接管
    let aiResult = null;             // null | 'fail' | 'full'
    let foodEatenCount = 0;          // AI 本局累计吃到几个食物

    // ---------- 达标状态 ----------
    let winShown = false;            // 本局是否已经弹过达标界面（每局只弹一次）
    let winScreenVisible = false;    // 胜利界面此刻是否显示在画面上
    let winPausedByBanner = false;   // 界面是不是把游戏停住了（用于"继续玩"时恢复）

    // ---------- "本局是否真在进行中" ----------
    //  与 roundPending / gameOver 不是一回事：
    //    roundPending 是"停在开局提示上，还没开始"
    //    gameOver     是"已经结束"
    //    roundInProgress 才是"确实开出去了一局、还没收尾"
    //  用途：① 决定「重新开始」「结束本局」显不显示
    //        ② 判断从工具栏点「重新开始」时该不该把这一局记进战绩 ——
    //           停在开局提示上点它不该记（那一局根本没开始），
    //           玩到一半点它才该记。
    let roundInProgress = false;

    // ---------- 恢复前的倒计时 ----------
    //  从"暂停"或"胜利界面"切回游戏时，先给 3 秒缓冲再开始跑。
    //  理由：切回来那一瞬间玩家的手指还在原来的位置，蛇立刻动很容易直接撞死；
    //  倒计时期间画面静止、数字在跳，玩家能看清还剩多久。
    //  期间空格（暂停）与方向键都**不响应** —— 否则倒计时就失去意义了。
    let countdownEndsAt = 0;         // 倒计时结束的时间戳（0 表示没有在倒计时）
    let countdownShownDigit = 0;     // 上一帧显示的数字，用于驱动状态栏文案
    const COUNTDOWN_MS = 3000;       // 3 秒

    // ---------- 开局提示界面 ----------
    // 含义反过来写更省事：roundPending 为 true 表示"这一局还没开始，
    // 正停在开局提示上"——不推进逻辑、不接受转向，画面由 drawCanvas
    // 画出提示层。按空格或点画面才开始。只有"开一局手动游戏"会置 true，
    // AI 演示与旧的一局结束都不经过它，避免挡住已有流程。
    let roundPending = false;

    // ---------- 战绩 / 主题 ----------
    let roundHistory = [];
    let currentTheme = 'light';

    // 方向向量：只此一份，BFS 与真实移动共用，避免"算法和移动不一致"
    const DIR_VECTORS = [
        { name: 'up',    dx: 0,  dy: -1 },
        { name: 'down',  dx: 0,  dy: 1  },
        { name: 'left',  dx: -1, dy: 0  },
        { name: 'right', dx: 1,  dy: 0  }
    ];
    const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

    // 游戏用到的哈密顿回路（预计算常量，见下方 CYCLE_ROUTE 的定义与说明）。
    // 蛇沿它循环前进可以遍历每一个格子且永不撞到自己。
    let cycleRoute = [];
    let cycleIndex = new Map();   // "x,y" -> 在回路上的序号

    // ================================================================
    //  安全读写 localStorage（file:// 或隐私模式下可能抛异常）
    // ================================================================
    function safeGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeSet(key, value) {
        try { localStorage.setItem(key, value); } catch (e) { /* 忽略 */ }
    }

    // ================================================================
    //  初始化 / 重置
    // ================================================================
    function initGame() {
        // 初始蛇形必须落在回路上、且"蛇头在回路序号的最后"、方向与回路一致，
        // 否则 AI 一旦接管就可能出现蛇头前方的回路格被自己身体占用。
        //
        // 现在取回路上下标 368 处的一段：route[368]=(9,9), route[367]=(9,10),
        // route[366]=(10,10)，恰好贴着棋盘正中心（20×20 的中心是 9.5,9.5，
        // 这三格距中心都是 1 格），方向 up 与回路走向一致。
        // 这段是用 _center.js 在回路上按"距中心最近"筛出来的，不是手挑的。
        snake = [
            { x: 9, y: 9 },
            { x: 9, y: 10 },
            { x: 10, y: 10 }
        ];
        direction = 'up';
        nextDirection = 'up';
        score = 0;
        stepCount = 0;
        gameOver = false;
        winFlag = false;
        roundInProgress = false;   // 新一局还没开始跑，等 beginRound / startAI 置位
        aiMode = false;
        aiResult = null;
        foodEatenCount = 0;
        paused = false;
        endReason = null;
        // 达标界面随新一局复位
        winShown = false;
        winScreenVisible = false;
        winPausedByBanner = false;
        hideWinBanner();
        effectsReset();
        buildCycleRoute();
        aiProgress.innerText = '';
        updateScoreDisplay();
        updatePauseButton();
        // 初始蛇长 3 远小于总格数，这里必然能生成食物
        if (!generateFood()) {
            endGame('蛇身铺满全部格子，这局到头了', 'full');
        }
        clearStatus();
        drawCanvas();
    }

    /**
     * 重置到一局干净的对局，但**不启动游戏循环**。
     * 循环由 beginRound() 负责 —— 现在每局都要先停在开局提示上，
     * 所以这里如果顺手 startLoop()，就会在玩家还没看清目标时蛇已经在动了。
     */
    function resetGame() {
        stopLoop();
        initGame();
        statusTip.innerText = '🔄 新的一局！';
    }

    // ================================================================
    //  食物生成（必须保证有解）
    // ----------------------------------------------------------------
    //  不能随便在空格里撒食物。蛇身始终是回路上的一段连续弧，蛇只能沿
    //  回路向前走；如果食物落在蛇头**后方**的格子上，蛇根本绕不回去，
    //  这一局就变成死局了。
    //
    //  所以食物的候选范围被限制为：从蛇头沿回路向前 1 ~ (L+1) 格。
    //   - 起点从「蛇头前 1 格」开始：不能生成在蛇头脚下，否则白送且看起来像 bug。
    //   - 上界取 L+1（L 为当前蛇长）：吃到后蛇长变成 L+1，此时蛇身刚好是
    //     一段首尾相接、长度 L+1 的弧（头和尾在回路上相邻），不变式继续成立。
    //     这个上界同时保证了"无论随机落到哪一格，吃到它都不会破坏结构"。
    //
    //  这个范围里必然有空格（蛇长 L < 总数，且上界 ≥ 1），所以不会无解；
    //  万一没有，直接抛错暴露问题，而不是静默退化成"随便找个空格"。
    //
    //  返回值：true 表示已生成食物；false 表示棋盘已满（调用方应判定胜利）。
    // ================================================================
    function generateFood() {
        const totalCells = GRID_SIZE * GRID_SIZE;
        if (snake.length >= totalCells) return false;

        if (!cycleRoute.length) buildCycleRoute();
        const head = snake[0];
        const headIdx = cycleIndex.get(head.x + ',' + head.y);
        if (headIdx === undefined) {
            throw new Error('蛇头不在回路上：(' + head.x + ',' + head.y + ')');
        }

        const occupied = new Set(snake.map(seg => seg.x + ',' + seg.y));
        // 向前可达的范围：最少 1 格，最多 L+1 格，同时不超过剩余空格数
        const maxAhead = Math.min(snake.length + 1, totalCells - snake.length);
        const offset = 1 + Math.floor(Math.random() * maxAhead);
        for (let i = 0; i < totalCells; i++) {
            const cell = cycleRoute[(headIdx + offset + i) % totalCells];
            if (!occupied.has(cell.x + ',' + cell.y)) {
                food = { x: cell.x, y: cell.y };
                return true;
            }
        }
        throw new Error('食物生成失败：向前 ' + maxAhead + ' 格内没有空位');
    }

    // ================================================================
    //  核心移动（由定时器调用）
    // ================================================================
    function moveSnake() {
        if (gameOver || paused) return;

        const totalCells = GRID_SIZE * GRID_SIZE;
        const cellSize = canvas.width / GRID_SIZE;

        // ---- 方向决策 ----
        let moveDir;
        if (aiMode) {
            moveDir = decideMove();
            if (!moveDir) {
                endGame('AI 无路可走 😵', 'fail');
                return;
            }
        } else {
            moveDir = direction;
            if (nextDirection && OPPOSITE[nextDirection] !== direction) {
                moveDir = nextDirection;
            }
        }

        // ---- 计算新蛇头 ----
        const vec = DIR_VECTORS.find(v => v.name === moveDir);
        const head = snake[0];
        const newHead = { x: head.x + vec.dx, y: head.y + vec.dy };

        // ---- 越界 ----
        if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
            endGame('撞墙了... 💥', 'fail');
            return;
        }

        // ---- 是否吃到食物（决定蛇尾这一帧是否让位）----
        const isEating = (newHead.x === food.x && newHead.y === food.y);

        // ---- 身体碰撞：不吃食物时蛇尾会腾空，所以排除最后一节 ----
        const bodyLimit = isEating ? snake.length : snake.length - 1;
        for (let i = 0; i < bodyLimit; i++) {
            if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                endGame('咬到自己了 😵', 'fail');
                return;
            }
        }

        // ---- 结算蛇 ----
        snake.unshift(newHead);
        if (!isEating) snake.pop();
        direction = moveDir;
        stepCount++;          // 每成功走一步就记一次（死亡那一步不计，因为提前 return 了）

        // ---- 处理食物 ----
        if (isEating) {
            score++;
            if (score > highScore) {
                highScore = score;
                safeSet('snakeHighScore', String(highScore));
            }
            updateScoreDisplay();
            // 反馈：在食物那一格炸开一圈小点，并浮出一个「+1」。
            spawnEatEffects(
                food.x * cellSize + cellSize / 2,
                food.y * cellSize + cellSize / 2
            );

            // 达标检查：首次到 15 分会弹出胜利界面，停住等玩家选"继续玩 / 重新开始"。
            // 放在生成新食物之前——界面期间不需要新食物，避免它一闪而过。
            checkWinScore();
            if (paused) { drawCanvas(); return; }

            if (aiMode) {
                foodEatenCount++;
                // 不再显示 "n / 399" 这种上限，只报已吃数量：本局可以一直玩下去
                aiProgress.innerText = '🍽️ ' + foodEatenCount;
            }

            // 终局：蛇身铺满全部格子，再没有空格可放食物。
            // 这**不是胜利条件**（胜利是拿到 WIN_SCORE 分那条路径），
            // 而是棋盘物理上装不下了，这局自然到头。
            if (snake.length >= totalCells || !generateFood()) {
                endGame('蛇身铺满全部 ' + totalCells + ' 格，这局到头了' +
                        (aiMode ? '（全程零人工操作）' : '') +
                        '。点「重新开始」再来一局', 'full');
                return;
            }
            if (gameOver) { drawCanvas(); return; }
        }

        drawCanvas();
    }

    // ================================================================
    //  AI 决策核心
    // ----------------------------------------------------------------
    //  两个策略，每次移动时二选一：
    //
    //   [贪心] 只在"整条吃到食物的路径都安全"时才用。
    //          安全 = 沿路径逐帧推演，每一步之后可达空格都装得下蛇身，
    //          且还摸得到自己的尾巴。条件很严，但满足时又快又好看。
    //
    //   [回路] 沿预先算好的"回"字形哈密顿回路前进。回路遍历全盘，
    //          所以迟早会路过食物，而且永远不会撞到自己。
    //          慢，但绝对安全。
    //
    //  实际使用的只有【回路】这一种策略：蛇头永远走向回路上的下一格，
    //  因为蛇身恒为回路上一段连续弧，那一格必然空着，所以既不会撞墙、
    //  也不会撞到自己，可以一直玩到铺满全盘为止。
    //
    //  下面的贪心 + 安全校验（greedyMoveIfSafe / bfsPath / isPathSafe 等）
    //  只在回路万一失效时兜底，正常流程不会走到。
    // ================================================================

    function decideMove() {
        const dir = getCycleMove();
        if (dir) return dir;
        // 理论上到不了这里：蛇身恒为回路上一段连续弧，头部前方必有空格。
        // 万一不变式被破坏（例如有人改了初始蛇形却没同步），
        // 退回"贪心 + 安全校验"，宁可走得慢也不要直接判死。
        return greedyMoveIfSafe();
    }

    /**
     * 贪心决策：返回一个"整条到食物的路径都安全"的方向；
     * 没有这样的方向就返回 null（由调用方转回路策略）。
     */
    function greedyMoveIfSafe() {
        const head = snake[0];
        const candidates = [];

        for (const v of DIR_VECTORS) {
            const state = buildStateAfter(head, v.name);
            if (!state) continue;                       // 撞墙或撞身体，淘汰
            const analysis = analyzeSpace(state);
            if (analysis.space < state.snake.length) continue;   // 落子即困死，淘汰
            candidates.push({ dir: v.name, state: state, space: analysis.space });
        }
        if (!candidates.length) return null;

        const foodFirst = bfsFirstStep(food, bodyWithoutTail());
        const eating = candidates.find(c => c.dir === foodFirst);
        if (!eating) return null;                       // 到食物的路被堵住

        const path = bfsPath(food);
        if (path && isPathSafe(eating.state, path)) return eating.dir;
        return null;
    }

    /**
     * 哈密顿回路（预计算常量）。
     *
     * 这是 20×20 盘上一条真正闭合的回路：400 个格子各出现一次，
     * 相邻两项在网格上都相邻，且最后一项 route[399]=(0,1) 与
     * 起点 route[0]=(0,0) 也相邻。蛇沿它前进时，身体永远是回路上

    function buildCycleRoute() {
        if (cycleRoute.length) return;
        cycleRoute = CYCLE_ROUTE;
        cycleIndex = new Map();
        for (let i = 0; i < cycleRoute.length; i++) {
            cycleIndex.set(cycleRoute[i].x + ',' + cycleRoute[i].y, i);
        }
    }

    /**
     * 自检：确认回路常量真的是一条覆盖全盘、处处相邻的闭合回路，
     * 且初始蛇形确实"躺在"回路上（蛇头序号最大、朝向与回路一致）。
     * 只在控制台告警，不影响游戏运行。
     */
    function assertCycleRoute() {
        const n = GRID_SIZE;
        const problems = [];
        if (cycleRoute.length !== n * n) problems.push('长度 ' + cycleRoute.length + ' != ' + n * n);
        if (cycleIndex.size !== cycleRoute.length) problems.push('存在重复格子');
        for (let i = 0; i < cycleRoute.length; i++) {
            const a = cycleRoute[i];
            const b = cycleRoute[(i + 1) % cycleRoute.length];
            if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) {
                problems.push('第 ' + i + ' 项与下一项不相邻');
                break;
            }
        }
        // 初始蛇形是否与回路一致：蛇头序号应大于身体，且下一格是回路后继
        const indices = snake.map(s => cycleIndex.get(s.x + ',' + s.y));
        if (indices.some(i => i === undefined)) {
            problems.push('初始蛇形有格子不在回路上');
        } else {
            for (let i = 1; i < indices.length; i++) {
                if (indices[i] !== indices[0] - i) { problems.push('初始蛇形不是回路上的一段连续弧'); break; }
            }
            const next = cycleRoute[(indices[0] + 1) % cycleRoute.length];
            const head = snake[0];
            if (Math.abs(next.x - head.x) + Math.abs(next.y - head.y) !== 1) {
                problems.push('蛇头前方不是回路后继');
            }
        }
        if (problems.length) console.warn('[回路自检未通过] ' + problems.join('; '));
        return problems;
    }

    /** 兜底策略：朝回路上下一个空格子的方向走 */
    function getCycleMove() {
        if (!cycleRoute.length) buildCycleRoute();
        const head = snake[0];
        const here = cycleIndex.get(head.x + ',' + head.y);
        const total = cycleRoute.length;
        const occupied = toKeySet(snake);
        for (let step = 1; step < total; step++) {
            const next = cycleRoute[(here + step) % total];
            if (!occupied.has(next.x + ',' + next.y)) {
                const dx = next.x - head.x;
                const dy = next.y - head.y;
                const vec = DIR_VECTORS.find(v => v.dx === dx && v.dy === dy);
                return vec ? vec.name : null;
            }
        }
        return null;
    }

    /**
     * 构造"假如走这一步"之后的局面。
     * 必须和 moveSnake 完全一致的规则：吃到食物时蛇尾不让位。
     */
    function buildStateAfter(head, dirName) {
        const vec = DIR_VECTORS.find(v => v.name === dirName);
        const nx = head.x + vec.dx;
        const ny = head.y + vec.dy;
        if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) return null;

        const willEat = (nx === food.x && ny === food.y);
        const bodyLimit = willEat ? snake.length : snake.length - 1;
        for (let i = 0; i < bodyLimit; i++) {
            if (snake[i].x === nx && snake[i].y === ny) return null;
        }

        const newSnake = [{ x: nx, y: ny }].concat(willEat ? snake : snake.slice(0, -1));
        // 蛇尾在下一刻是否让位，决定 BFS 里能不能把它当通路
        return { snake: newSnake, grows: willEat, head: { x: nx, y: ny } };
    }

    function toKeySet(cells) {
        const s = new Set();
        for (const c of cells) s.add(c.x + ',' + c.y);
        return s;
    }

    /**
     * 洪水填充：统计从 head 出发能走到的空格数量，以及能否摸到蛇尾。
     * 两者都是"这步走完还有没有活路"的量化指标。
     */
    function analyzeSpace(state) {
        const body = toKeySet(state.snake);
        const headKey = state.head.x + ',' + state.head.y;
        const tail = state.snake[state.snake.length - 1];
        const tailKey = tail.x + ',' + tail.y;
        // 不吃食物时蛇尾会移开，所以它可以当作通路
        if (!state.grows) body.delete(tailKey);

        const seen = new Set([headKey]);
        const queue = [state.head];
        let count = 0;
        let canReachTail = false;

        while (queue.length) {
            const cur = queue.shift();
            if (cur.x === tail.x && cur.y === tail.y) canReachTail = true;
            for (const v of DIR_VECTORS) {
                const nx = cur.x + v.dx;
                const ny = cur.y + v.dy;
                const key = nx + ',' + ny;
                if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
                if (body.has(key)) continue;
                if (seen.has(key)) continue;
                seen.add(key);
                count++;
                queue.push({ x: nx, y: ny });
            }
        }
        return { space: count, canReachTail };
    }

    /** BFS 最短路：返回第一步的方向，找不到返回 null */
    function bfsFirstStep(target, blocked) {
        const head = snake[0];
        if (head.x === target.x && head.y === target.y) return null;
        const blockedSet = toKeySet(blocked);
        const headKey = head.x + ',' + head.y;
        blockedSet.delete(headKey);

        const visited = new Set([headKey]);
        const queue = [{ x: head.x, y: head.y, first: null }];

        while (queue.length) {
            const cur = queue.shift();
            for (const v of DIR_VECTORS) {
                const nx = cur.x + v.dx;
                const ny = cur.y + v.dy;
                const key = nx + ',' + ny;
                if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
                if (visited.has(key)) continue;
                if (blockedSet.has(key)) continue;
                visited.add(key);
                const first = cur.first || v.name;
                if (nx === target.x && ny === target.y) return first;
                queue.push({ x: nx, y: ny, first });
            }
        }
        return null;
    }

    /**
     * 拆掉尾巴后的蛇身 —— 只用于 BFS 寻路。
     * 保留尾巴是必须的：搜索用的是"静止"棋盘，而移动中尾巴会腾空，
     * 如果这里把尾巴移除、可行性判断又按移动规则算，两边就打架了。
     */
    function bodyWithoutTail() {
        return snake.slice(0, -1);
    }

    /**
     * 沿一条路径逐帧推演，检查"走完这条路的过程中会不会把自己围死"。
     * 只检查落子后一瞬间是不够的：可能需要走上十几步才吃到食物，
     * 中途某一步把可达空间压缩到装不下蛇身，就再也出不来了。
     */
    function isPathSafe(state, path) {
        let cur = state;
        for (const cell of path) {
            let vec = null;
            for (const v of DIR_VECTORS) {
                if (cur.head.x + v.dx === cell.x && cur.head.y + v.dy === cell.y) { vec = v; break; }
            }
            if (!vec) return false;
            const nx = cell.x, ny = cell.y;
            const willEat = (nx === food.x && ny === food.y);
            const bodyLimit = willEat ? cur.snake.length : cur.snake.length - 1;
            for (let i = 0; i < bodyLimit; i++) {
                if (cur.snake[i].x === nx && cur.snake[i].y === ny) return false;
            }
            const newSnake = [{ x: nx, y: ny }].concat(willEat ? cur.snake : cur.snake.slice(0, -1));
            cur = { snake: newSnake, grows: willEat, head: { x: nx, y: ny } };
            const an = analyzeSpace(cur);
            if (an.space < cur.snake.length) return false;   // 这一步走完没活路
            if (!an.canReachTail) return false;              // 摸不到尾巴 = 危险形状
        }
        return true;
    }

    /** BFS 返回从蛇头到目标的完整路径（含目标格），找不到返回 null */
    function bfsPath(target) {
        const head = snake[0];
        const blockedSet = toKeySet(bodyWithoutTail());
        const headKey = head.x + ',' + head.y;
        blockedSet.delete(headKey);

        const prev = new Map();
        const visited = new Set([headKey]);
        const queue = [head];
        let found = false;

        while (queue.length && !found) {
            const cur = queue.shift();
            for (const v of DIR_VECTORS) {
                const nx = cur.x + v.dx;
                const ny = cur.y + v.dy;
                const key = nx + ',' + ny;
                if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
                if (visited.has(key) || blockedSet.has(key)) continue;
                visited.add(key);
                prev.set(key, cur);
                if (nx === target.x && ny === target.y) { found = true; break; }
                queue.push({ x: nx, y: ny });
            }
        }
        if (!found) return null;

        const path = [];
        let node = { x: target.x, y: target.y };
        while (!(node.x === head.x && node.y === head.y)) {
            path.unshift(node);
            node = prev.get(node.x + ',' + node.y);
            if (!node) return null;
        }
        return path.length ? path : null;
    }

    // ================================================================
    //  结束游戏
    // ----------------------------------------------------------------
    //  result 取值：
    //    'fail' —— 撞墙 / 咬到自己，这局输了
    //    'full' —— 蛇身铺满全盘，没有空格可放食物，这局自然到头（不是失败）
    //  result 与胜利无关：拿满 WIN_SCORE 分由 checkWinScore 单独处理，
    //  不会走到这里。所以这里的「失败」只包括撞墙与被自己咬到两种。
    // ================================================================
    /**
     * @param message  结束原因（写进状态栏与画面）
     * @param result   'fail'（撞死 / 玩家叫停）| 'full'（铺满全盘）
     * @param userEnded 是否由玩家主动叫停（结束本局 / 玩到一半重开），
     *                  只影响战绩里的图标，不影响任何收尾逻辑
     */
    function endGame(message, result, userEnded) {
        if (gameOver) return;
        gameOver = true;
        roundInProgress = false;               // 本局收尾了
        paused = false;                        // 结束时取消暂停状态
        updatePauseButton();
        const outcome = result || 'fail';
        winFlag = (outcome === 'full');       // 铺满算"圆满走完"，不是输
        // 结束原因：既写进状态栏，也画在画布上，不用低头看
        endReason = message;
        // 结束态下空格键的含义是"重新开始"（见键盘处理里的分支），
        // 所以在状态栏把它写出来 —— 玩家不用去猜空格现在管什么。
        statusTip.innerText = (outcome === 'fail' ? '💀 ' : '🎉 ') + message
            + ' —— 按空格重新开始';

        // 死亡反馈：闪一下红屏（铺满全盘是自然终点，不闪）
        if (outcome === 'fail') spawnDeathEffect();

        // 先记下这一局是不是 AI 打的，再清 aiMode：
        // 下面 recordRound 要用它来标注模式，顺序反了战绩就会全记成"手动"。
        const wasAI = aiMode;
        if (aiMode) {
            aiMode = false;
            aiResult = outcome;
            aiProgress.innerText = (outcome === 'fail') ? '❌ 结束' : '✅ 填满全盘';
        }

        if (score > highScore) {
            highScore = score;
            safeSet('snakeHighScore', String(highScore));
            highScoreSpan.innerText = highScore;
        }

        // 记录本局战绩（无论胜负）
        recordRound(outcome, message, wasAI, !!userEnded);
        drawCanvas();
    }

    // ================================================================
    //  多局战绩（新增功能之一）
    // ================================================================
    function loadHistory() {
        const raw = safeGet('snakeHistory');
        if (!raw) { roundHistory = []; return; }
        try {
            const parsed = JSON.parse(raw);
            roundHistory = Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            roundHistory = [];
        }
    }

    function saveHistory() {
        safeSet('snakeHistory', JSON.stringify(roundHistory));
    }

    function recordRound(outcome, message, wasAI, userEnded) {
        roundHistory.push({
            score: score,
            mode: wasAI ? 'AI' : '手动',
            // outcome：'fail'（撞死 / 玩家叫停）| 'full'（铺满全盘）
            result: outcome,
            // 玩家主动叫停（结束本局 / 玩到一半重开）时标成 'restart'，
            // 只用于在战绩列表里换个图标（🔄），语义上仍属于 fail
            endedByUser: !!userEnded,
            won: outcome === 'full',           // 铺满全盘视为圆满走完
            time: Date.now()
        });
        // 只保留最近 HISTORY_MAX 局：新的一局自动追加，超出则丢弃最旧的
        if (roundHistory.length > HISTORY_MAX) {
            roundHistory = roundHistory.slice(-HISTORY_MAX);
        }
        // 累计总局数：不受 HISTORY_MAX 限制，一直加上去
        roundCount++;
        safeSet('snakeRoundCount', String(roundCount));
        updateRoundCountDisplay();
        saveHistory();
        renderHistory();
    }

    function renderHistory() {
        historyList.innerHTML = '';
        if (!roundHistory.length) {
            historyEmpty.style.display = 'block';
            return;
        }
        historyEmpty.style.display = 'none';

        // 倒序展示：最新一局在最上面
        const recent = roundHistory.slice(-HISTORY_MAX).reverse();
        recent.forEach((item, i) => {
            const li = document.createElement('li');
            const index = roundHistory.length - i;
            // 图标规则：
            //   铺满全盘（round 走完）        -> ✅
            //   手动结束本局 / 玩到一半重开   -> 🔄（这两种都是玩家自己叫停的）
            //   撞死（手动）                  -> 💀
            //   撞死（AI）                    -> 🤖
            const icon = item.won ? '✅'
                : (item.endedByUser ? '🔄'
                    : (item.mode === 'AI' ? '🤖' : '💀'));

            // 奖杯：**手动**打到 WIN_SCORE 分及以上才加，跟在成绩图标右边。
            // 它跟上面那个图标是两件事 —— 后者说"这局怎么结束的"，奖杯说
            // "这局打到了达标线"，所以两个都留着，比如「🔄🏆 15」。
            // AI 不加：AI 那条路线本来就会一路吃到铺满全盘，局局都有奖杯，
            // 反而看不出哪一局值得夸。
            const trophy = (item.mode !== 'AI' && item.score >= WIN_SCORE) ? '🏆' : '';

            const idxSpan = document.createElement('span');
            idxSpan.className = 'h-index';
            idxSpan.textContent = '#' + index;

            const modeSpan = document.createElement('span');
            modeSpan.className = 'h-mode';
            modeSpan.textContent = item.mode;

            const scoreSpan = document.createElement('span');
            scoreSpan.className = 'h-score';
            scoreSpan.textContent = icon + trophy + ' ' + item.score;

            li.appendChild(idxSpan);
            li.appendChild(modeSpan);
            li.appendChild(scoreSpan);
            historyList.appendChild(li);
        });
    }

    // ================================================================
    //  反馈效果：推进与生成
    // ----------------------------------------------------------------
    //  设计原则：只做"看得懂发生了什么"的最小集合，不加背景音、不加弹窗。
    //    · 吃到食物 → 食物位置炸开小点 + 上浮「+1」
    //    · 蛇死亡   → 整屏红色闪一下
    //    · 暂停     → 画面盖一层并写明"已暂停"
    //  这些都是纯视觉对象，过期自动丢弃，不影响任何游戏逻辑。
    // ================================================================
    function updateEffects() {
        const now = Date.now();

        particles = particles.filter(p => now - p.born < EFFECT_PARTICLE_LIFE);
        for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.06;          // 轻微下坠，看起来像迸溅
        }

        floaters = floaters.filter(f => now - f.born < EFFECT_FLOATER_LIFE);
    }

    /**
     * 吃到食物时的画面反馈：在食物那一格炸开一圈小点，并浮出一个「+1」。
     *
     * 粒子是 8 颗、随机角度与速度、金绿两色，带一点下坠，看起来像迸溅。
     * （这一套曾被要求去掉过，后来又要求恢复。）
     */
    function spawnEatEffects(cx, cy) {
        const now = Date.now();
        for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
            const sp = 0.8 + Math.random() * 1.4;
            particles.push({
                x: cx, y: cy,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                born: now,
                hue: Math.random() < 0.5 ? '#2ecc71' : '#f1c40f'
            });
        }
        floaters.push({ x: cx, y: cy, text: '+1', born: now, color: '#2ecc71' });
    }

    function spawnDeathEffect() {
        deathFlashUntil = Date.now() + EFFECT_FLASH_LIFE;
    }

    function effectsReset() {
        particles = [];
        floaters = [];
        deathFlashUntil = 0;
    }

    // ================================================================
    //  绘制 Canvas
    // ================================================================
    function drawCanvas() {
        const size = GRID_SIZE;
        const cellSize = canvas.width / size;
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const now = Date.now();

        // 蛇还没初始化时直接返回。
        // 这不是可有可无的保险：applyTheme() 内部会调 drawCanvas()，而启动流程里
        // applyTheme 曾经排在 initGame 之前，于是 snake 还是空数组就去读 snake[0].x，
        // 抛 TypeError 把 bootstrap 整个打断 —— 表现为"首屏有食物但没有蛇、也不能玩"。
        if (!snake.length) return;

        ctx.fillStyle = isDark ? '#1a1a2e' : '#f8f9fa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = isDark ? '#2a3a5e' : '#e9ecef';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= size; i++) {
            ctx.beginPath();
            ctx.moveTo(i * cellSize, 0);
            ctx.lineTo(i * cellSize, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * cellSize);
            ctx.lineTo(canvas.width, i * cellSize);
            ctx.stroke();
        }

        // ---------- 蛇身与蛇头共用同一个颜色公式 ----------
        // 身体从尾到头渐亮；蛇头用与"紧邻头的那一节"完全相同的颜色，
        // 不再单独调亮 —— 否则头会显得比身体浅、像贴上去的。
        // 蛇头的辨识度改由**眼睛**承担（见下），不靠变浅或变大。
        function bodyColor(t, dark) {
            const shade = Math.round(150 + 40 * t);
            return dark
                ? 'rgb(' + Math.round(20 + 10 * t) + ',' + shade + ',' + Math.round(140 + 20 * t) + ')'
                : 'rgb(' + Math.round(28 + 12 * t) + ',' + shade + ',' + Math.round(80 + 25 * t) + ')';
        }

        const len = snake.length;
        for (let i = len - 1; i >= 1; i--) {
            const seg = snake[i];
            const x = seg.x * cellSize;
            const y = seg.y * cellSize;
            // t: 0(尾) → 1(紧邻头)
            const t = len > 1 ? 1 - i / (len - 1) : 1;
            ctx.fillStyle = bodyColor(t, isDark);
            ctx.shadowColor = isDark ? '#1abc9c' : '#27ae60';
            ctx.shadowBlur = i < 3 ? 7 : 3;
            ctx.beginPath();
            roundRectPath(ctx, x + 2.5, y + 2.5, cellSize - 5, cellSize - 5, 4);
            ctx.fill();
        }
        ctx.shadowBlur = 0;

        // ---------- 蛇头 ----------
        // 与身体的区别只有两点：同样的尺寸（不放大）、同样的颜色（不调浅），
        // 加上较强光晕与两只朝行进方向的眼睛。
        const head = snake[0];
        const hx = head.x * cellSize;
        const hy = head.y * cellSize;

        ctx.fillStyle = bodyColor(1, isDark);
        ctx.shadowColor = '#2ecc71';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        roundRectPath(ctx, hx + 2.5, hy + 2.5, cellSize - 5, cellSize - 5, 4);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 眼睛：按当前方向摆在头的两侧
        const vec = DIR_VECTORS.find(v => v.name === direction) || { dx: 1, dy: 0 };
        const cx = hx + cellSize / 2;
        const cy = hy + cellSize / 2;
        const off = cellSize * 0.21;      // 两眼横向间距的一半
        const fwd = cellSize * 0.15;      // 眼睛相对于中心前移
        const eyeR = Math.max(1.6, cellSize * 0.13);
        // 与前进方向垂直的单位向量
        const px = -vec.dy;
        const py = vec.dx;
        for (const s of [-1, 1]) {
            const ex = cx + vec.dx * fwd + px * off * s;
            const ey = cy + vec.dy * fwd + py * off * s;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ex, ey, eyeR, 0, 2 * Math.PI);
            ctx.fill();
            // 瞳孔朝前，强化"它在往哪走"
            ctx.fillStyle = '#10251a';
            ctx.beginPath();
            ctx.arc(ex + vec.dx * eyeR * 0.42, ey + vec.dy * eyeR * 0.42, eyeR * 0.52, 0, 2 * Math.PI);
            ctx.fill();
        }

        // ---------- 食物 ----------
        // 画在**蛇之后**。原来食物画在蛇前面，一旦食物紧邻蛇身，蛇的圆角方块
        // 加上 shadowBlur 光晕就会把食物盖掉 —— 看起来就是"食物被蛇身覆盖了"。
        // 玩家在"胜利后继续玩、蛇变长"时最容易撞见（长蛇更容易贴住食物）。
        const foodCx = food.x * cellSize + cellSize / 2;
        const foodCy = food.y * cellSize + cellSize / 2;
        const breathe = 1 + 0.10 * Math.sin(now / 260);
        const foodR = (cellSize / 2 - 3) * breathe;
        const foodColor = isDark ? '#f1c40f' : '#e74c3c';
        // 先描一圈与背景反差大的边：食物紧贴深色蛇身时也能看清轮廓
        ctx.beginPath();
        ctx.arc(foodCx, foodCy, foodR + 1.5, 0, 2 * Math.PI);
        ctx.fillStyle = isDark ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.95)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(foodCx, foodCy, foodR, 0, 2 * Math.PI);
        ctx.fillStyle = foodColor;
        ctx.shadowColor = foodColor;
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;
        // 中心高光，让食物更立体
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.arc(foodCx - cellSize * 0.11, foodCy - cellSize * 0.11, cellSize * 0.11, 0, 2 * Math.PI);
        ctx.fill();

        // ---------- 粒子与上浮文字 ----------
        for (const p of particles) {
            const age = (now - p.born) / EFFECT_PARTICLE_LIFE;
            ctx.globalAlpha = Math.max(0, 1 - age);
            ctx.fillStyle = p.hue;
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.7, cellSize * 0.11 * (1 - age)), 0, 2 * Math.PI);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // ---------- 死亡闪屏：叠在蛇之上、结算覆盖层之下 ----------
        if (deathFlashUntil > now) {
            const k = (deathFlashUntil - now) / EFFECT_FLASH_LIFE;
            ctx.fillStyle = 'rgba(231, 76, 60, ' + (0.45 * k).toFixed(3) + ')';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // ---------- 暂停覆盖层 ----------
        // 胜利界面造成的暂停不画这一层：胜利界面本身就在提示玩家，
        // 再叠一句"按空格或点「继续」恢复"会和它上面那两个按钮互相打架。
        // 倒计时期间也不画：那时 paused 同样是 true，但它自己有倒计时那一层，
        // 两层文字叠在一起会糊成一片（截图确认过）。
        if (paused && !gameOver && !winPausedByBanner && !countdownActive()) {
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 30px "Segoe UI", sans-serif';
            ctx.fillText('⏸️', canvas.width / 2, canvas.height / 2 - 22);
            ctx.font = 'bold 20px "Segoe UI", sans-serif';
            ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2 + 14);
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.globalAlpha = 0.85;
            ctx.fillText('按空格或点「继续」恢复', canvas.width / 2, canvas.height / 2 + 42);
            ctx.globalAlpha = 1;
        }

        // ---------- 恢复前倒计时 ----------
        // 画在暂停覆盖层**之后**：倒计时期间 paused 也是 true，若不盖住它，
        // 玩家会看到"已暂停"叠着"3"，两句提示互相打架。
        // 只画数字和一句短提示，不做整屏不透明底 —— 让玩家先看清盘面。
        if (countdownActive() && !gameOver) {
            const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
            const leftMs = countdownEndsAt - now;
            const digit = Math.max(1, Math.ceil(leftMs / 1000));

            // 数字切换时轻轻放大一下，让"在倒计时"这件事更明显
            const frac = 1 - (leftMs % 1000) / 1000;          // 0 -> 1
            const scale = 1 + 0.12 * Math.sin(frac * Math.PI);

            ctx.fillStyle = 'rgba(0,0,0,0.34)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.save();
            ctx.translate(cx, cy - 6);
            ctx.scale(scale, scale);
            ctx.fillStyle = isDark ? '#7fe3a4' : '#ffffff';
            ctx.font = 'bold 68px "Segoe UI", sans-serif';
            ctx.fillText(String(digit), 0, 0);
            ctx.restore();

            ctx.fillStyle = isDark ? '#cfe8d8' : 'rgba(255,255,255,0.92)';
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.fillText('准备开始…', cx, cy + 56);
            ctx.font = '13px "Segoe UI", sans-serif';
            ctx.globalAlpha = 0.8;
            ctx.fillText('倒计时期间暂停与转向不响应', cx, cy + 78);
            ctx.globalAlpha = 1;
        }

        // ---------- 开局提示层 ----------
        // 每局开始先停在这一屏，把"目标是什么、怎么操作"讲清楚再开始。
        // 期间游戏逻辑不推进（roundPending 时不排 tick），所以这一层是静止的。
        if (roundPending && !gameOver) {
            const W = canvas.width, H = canvas.height, cx = W / 2;

            // 半透明底 + 一层柔和的浅绿，和结束覆盖层的红/深色区分开
            ctx.fillStyle = isDark ? 'rgba(10, 20, 16, 0.86)' : 'rgba(240, 250, 244, 0.94)';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 标题
            ctx.fillStyle = isDark ? '#e8f5ec' : '#12351f';
            ctx.font = 'bold 26px "Segoe UI", sans-serif';
            ctx.fillText('🎯 本局目标', cx, H / 2 - 96);

            // 目标分数：这是整屏的重点，所以字号最大、用强调色
            ctx.fillStyle = isDark ? '#57d98a' : '#1e8f4e';
            ctx.font = 'bold 54px "Segoe UI", sans-serif';
            ctx.fillText(WIN_SCORE + ' 分', cx, H / 2 - 40);

            ctx.fillStyle = isDark ? '#b9c8bf' : '#3d5b4a';
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.fillText('吃到 ' + WIN_SCORE + ' 个食物就算赢', cx, H / 2 + 14);

            // 操作说明
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.fillText('⬆️ ⬇️ ⬅️ ➡️  方向键移动', cx, H / 2 + 52);
            ctx.fillText('空格键随时暂停 / 继续', cx, H / 2 + 76);

            // 开始提示：带一点呼吸感，提示"这里可以点"
            const breathe = 0.72 + 0.28 * Math.abs(Math.sin(now / 420));
            ctx.globalAlpha = breathe;
            ctx.fillStyle = isDark ? '#57d98a' : '#1e8f4e';
            ctx.font = 'bold 17px "Segoe UI", sans-serif';
            ctx.fillText('按空格键或点这里开始', cx, H / 2 + 126);
            ctx.globalAlpha = 1;
        }

        // ---------- 胜利界面 ----------
        // 达标时整屏庆祝，而不是只在画面下面露一条横幅 —— 横幅太容易被
        // 当成普通提示忽略掉。这里只画展示内容，两个操作按钮留在 DOM 上
        // （画在 canvas 里就得自己算点击命中，键盘和读屏也用不了）。
        if (winScreenVisible && !gameOver) {
            const W = canvas.width, H = canvas.height, cx = W / 2;

            // 金色半透明底：和开局提示的浅绿、结束覆盖层的红/深色区分开
            ctx.fillStyle = isDark ? 'rgba(30, 26, 8, 0.90)' : 'rgba(255, 250, 235, 0.95)';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 奖杯：轻微呼吸，别死板
            const breathe = 1 + 0.07 * Math.sin(now / 300);
            ctx.save();
            ctx.translate(cx, H / 2 - 104);
            ctx.scale(breathe, breathe);
            ctx.font = '52px "Segoe UI", sans-serif';
            ctx.fillText('🏆', 0, 0);
            ctx.restore();

            ctx.fillStyle = isDark ? '#ffd977' : '#b8860b';
            ctx.font = 'bold 34px "Segoe UI", sans-serif';
            ctx.fillText('胜利！', cx, H / 2 - 44);

            ctx.fillStyle = isDark ? '#7fe3a4' : '#1e8f4e';
            ctx.font = 'bold 20px "Segoe UI", sans-serif';
            ctx.fillText('吃到了 ' + WIN_SCORE + ' 个食物', cx, H / 2 + 4);

            // 三个小统计：横向排开，比堆成三行更好读
            const stats = [
                ['得分', String(score)],
                ['蛇长', String(snake.length)],
                ['步数', String(stepCount)]
            ];
            const gap = W / 3;
            stats.forEach(function (s, i) {
                const sx = gap * i + gap / 2;
                ctx.fillStyle = isDark ? '#ffe9a8' : '#8a6d1f';
                ctx.font = 'bold 22px "Segoe UI", sans-serif';
                ctx.fillText(s[1], sx, H / 2 + 58);
                ctx.fillStyle = isDark ? '#a99b73' : '#9c8c66';
                ctx.font = '13px "Segoe UI", sans-serif';
                ctx.fillText(s[0], sx, H / 2 + 84);
            });

            ctx.fillStyle = isDark ? '#c9bb92' : '#7d6f4d';
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.fillText('按空格继续玩，或重新开一局', cx, H / 2 + 128);
        }

        // ---------- 结束覆盖层 ----------
        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 28px "Segoe UI", sans-serif';
            ctx.fillText(winFlag ? '🎉' : '💀', canvas.width / 2, canvas.height / 2 - 10);
            // 把结束原因也写在画面上，不用低头看状态栏
            const label = endReason || (winFlag ? '填满全盘' : '游戏结束');
            ctx.font = 'bold 16px "Segoe UI", sans-serif';
            ctx.globalAlpha = 0.95;
            ctx.fillText(label, canvas.width / 2, canvas.height / 2 + 26);
            ctx.globalAlpha = 1;
        }

        // ---------- 上浮文字最后画，保证不被覆盖 ----------
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const f of floaters) {
            const age = (now - f.born) / EFFECT_FLOATER_LIFE;
            ctx.globalAlpha = Math.max(0, 1 - age);
            ctx.fillStyle = f.color;
            ctx.font = 'bold 16px "Segoe UI", sans-serif';
            ctx.fillText(f.text, f.x, f.y - age * cellSize * 1.6);
        }
        ctx.globalAlpha = 1;
    }

    /**
     * 圆角矩形路径。
     * 注意：这里刻意不去改写 CanvasRenderingContext2D.prototype。
     * 原实现用 `CanvasRenderingContext2D.prototype.roundRect = ...` 给所有
     * canvas 打补丁，会覆盖浏览器原生的 roundRect，属于全局副作用；
     * 改成普通函数后只在本文件内生效。
     */
    function roundRectPath(c, x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    // ================================================================
    //  分数与状态
    // ================================================================
    function updateScoreDisplay() {
        scoreSpan.innerText = score;
        if (score > highScore) {
            highScore = score;
            safeSet('snakeHighScore', String(highScore));
        }
        highScoreSpan.innerText = highScore;
        updateRoundCountDisplay();
    }

    /**
     * 刷新「局数」显示。
     * 任务书的「计分制」验收标准要求记录 得分 / 最高分 / 局数 三项，
     * 前两项原本就有，局数是一直缺的。
     * 注意：这里显示的是**累计总局数**（跨局累加、刷新后保留），
     * 和右侧战绩面板的"最近 10 局"是两件事。
     */
    function updateRoundCountDisplay() {
        if (roundCountSpan) roundCountSpan.innerText = roundCount;
    }

    function clearStatus() {
        statusTip.innerText = '⬆️⬇️⬅️➡️ 方向键控制';
        aiProgress.innerText = '';
    }

    // ================================================================
    //  开局提示界面
    // ----------------------------------------------------------------
    //  每局开始先停在提示屏上，讲清目标再开始。刻意做成"画面上的提示层 +
    //  空格/点击开始"，而不是弹一个自动消失的 toast：玩家不会因为没看清
    //  而错过目标，也不会在还没准备好时蛇就已经在动了。
    // ================================================================
    function showRoundPrompt() {
        hideWinBanner();
        stopLoop();               // 提示期间不排 tick，画面静止
        roundPending = true;
        paused = false;           // 提示≠暂停，避免暂停按钮显示成"继续"
        updatePauseButton();
        clearStatus();
        drawCanvas();
        statusTip.innerText = '🎯 目标是吃到 ' + WIN_SCORE + ' 分 —— 按空格或点画面开始';
    }

    function beginRound() {
        if (!roundPending) return;
        roundPending = false;
        roundInProgress = true;  // 这一局真的开出去了（从工具栏点「重新开始」时据此记战绩）
        updatePauseButton();     // 开局了：暂停与「结束本局」出现（「重新开始」此间隐藏）
        startLoop();
        clearStatus();
        drawCanvas();
    }

    /** 重置并停在开局提示上（「重新开始」与开局走这条路）。 */
    function startNewRoundWithPrompt() {
        resetGame();
        showRoundPrompt();
    }

    // ================================================================
    //  达标（拿到 WIN_SCORE 分）
    // ----------------------------------------------------------------
    //  达到 WIN_SCORE 时**不自动结算**，而是弹出胜利界面让玩家自己决定：
    //    · 继续玩 —— 分数与蛇原样保留，接着玩下去（界面不再重复弹）
    //    · 重新开始 —— 回到开局提示，开新一局
    //  界面出现时把游戏停住（复用暂停那套 stopLoop），否则玩家还没看完
    //  说明，蛇就已经撞死了。
    // ================================================================
    function showWinBanner() {
        // 展示内容（奖杯、得分、蛇长、步数）画在画布的胜利界面上，
        // 这里只负责让那两个操作按钮出现。
        // winScreenVisible 与 winShown 是两件事：后者是"本局已弹过"，
        // 会一直保持 true；前者是"此刻正在显示"，点「继续玩」后要关掉，
        // 否则胜利界面会一直盖在画面上。
        winScreenVisible = true;
        winBanner.classList.add('show');

        // 清掉吃食物留下的粒子与「+1」上浮文字：它们会飘在胜利界面上面，
        // 像多余的残影（实测奖杯上会叠一个 +1）。
        particles = [];
        floaters = [];

        // 停住游戏，等玩家选择。
        //
        // 这里**无条件**把 winPausedByBanner 置为 true，不能写成"只有原本没暂停
        // 才置位"。原因是玩家可能**先按了暂停、再吃到第 15 分**：那种情况下
        // paused 本来就 true，若按条件跳过赋值，winPausedByBanner 会留在 false，
        // 于是点「继续玩」时 continuePlaying 里 `if (winPausedByBanner)` 不成立、
        // 不恢复游戏 —— 画面上的「已暂停」覆盖层就一直留着，看起来像
        // "胜利界面没消失"。实测复现过这条路径。
        //
        // 语义上也该如此：「继续玩」意思是继续这一局，不管暂停是谁按的。
        if (!gameOver) {
            if (!paused) stopLoop();
            paused = true;
            winPausedByBanner = true;
            updatePauseButton();
        }
        // 无论是否新暂停，都重绘一次 —— winShown 已置位，胜利界面才会画出来
        drawCanvas();
    }

    function hideWinBanner() {
        winScreenVisible = false;
        winBanner.classList.remove('show');
        // 关掉胜利界面意味着离"回到一局进行中的游戏"不远了：这里先把暂停键
        // 恢复显示。「重新开始」那条路径随后会走 showRoundPrompt()，它会再
        // 把按钮藏起来；「继续玩」则直接进入倒计时，按钮应当可见。
        // 放在这里而不是只放 continuePlaying()，是为了两条路径都不用各自补一遍。
        updatePauseButton();
    }

    /**
     * 吃到一个食物后调用：首次达到 WIN_SCORE 就弹胜利界面。
     * 只在 aiMode 为假时弹 —— AI 演示是要一路填满全盘的，
     * 中途停下来等点击会打断演示。
     */
    function checkWinScore() {
        if (winShown) return;
        if (score < WIN_SCORE) return;
        winShown = true;
        if (aiMode) return;          // AI 演示不打断
        if (roundPending) return;    // 还没开始就不可能达标，纯属防御
        showWinBanner();
    }

    function continuePlaying() {
        hideWinBanner();
        if (winPausedByBanner) {
            winPausedByBanner = false;
            // 不走"立即恢复"，而是先给 3 秒倒计时 —— 玩家刚点完按钮，
            // 手还没回到方向键上，蛇立刻动很容易一上来就撞死。
            startCountdown();
            return;
        }
        // 没有因为界面停住（理论上不该走到这里）：照旧直接恢复
        paused = false;
        updatePauseButton();
        startLoop();
        statusTip.innerText = '▶️ 继续游戏，看看还能拿多少分';
        drawCanvas();
    }

    function restartFromBanner() {
        hideWinBanner();
        winPausedByBanner = false;
        startNewRoundWithPrompt();   // 同样先停在开局提示上
    }

    // ================================================================
    //  游戏循环控制
    // ----------------------------------------------------------------
    //  固定节奏：每 tick 只走 1 步，两种情况各用一个固定间隔——
    //  手动模式用 TICK_INTERVAL，AI 模式用 AI_TICK_INTERVAL。
    //
    //  这里刻意**不做**按进度自动提速：之前为了在合理时间内铺满全盘，
    //  曾让 AI 随已吃食物数从 1 步/帧一路加到 60 步/帧，但那样后期快到
    //  看不清过程，反而失去了"看 AI 怎么玩"的意义。现在 AI 是匀速的，
    //  全程都能看清。
    //
    //  仍然用 setTimeout 自调度而不是 setInterval：一是两种模式的间隔可以
    //  在同一处决定，不必在切换模式时推倒重建定时器；二是暂停时要能干净地
    //  停掉、恢复时接着走。
    // ================================================================
    function tickDelay() {
        return aiMode ? AI_TICK_INTERVAL : TICK_INTERVAL;
    }

    function scheduleTick() {
        gameLoopTimer = setTimeout(function () {
            if (gameOver || paused) return;   // 暂停时不再排下一帧，等于冻结
            moveSnake();
            if (!gameOver && !paused) scheduleTick();
        }, tickDelay());
    }

    function stopLoop() {
        if (gameLoopTimer) {
            clearTimeout(gameLoopTimer);
            gameLoopTimer = null;
        }
    }

    function startLoop() {
        stopLoop();
        scheduleTick();
    }

    // ================================================================
    //  动画帧循环（与游戏逻辑解耦）
    // ----------------------------------------------------------------
    //  游戏逻辑由上面的 tick 驱动，画面则由这个固定 30fps 的循环刷新。
    //  拆开的原因：粒子、上浮文字、"已暂停"覆盖层、"游戏结束"覆盖层都需要
    //  **独立于游戏节奏**地动或显示——比如暂停时游戏已经停摆，但画面还得
    //  把覆盖层画出来；结束时死亡闪屏也要能自己闪完。
    //  游戏逻辑本身完全不依赖这个循环，所以在无头测试里它跑不跑都无所谓。
    // ================================================================
    function startAnim() {
        if (animTimer) clearInterval(animTimer);
        animTimer = setInterval(function () {
            // 动画循环是页面上唯一"始终在跑"的定时器，所以把倒计时的推进
            // 挂在这里：暂停时逻辑定时器是停的，只有这里还能每帧跑。
            updateCountdown();
            updateEffects();
            drawCanvas();
        }, 33);
    }

    // ================================================================
    //  暂停 / 结束本局
    // ================================================================
    //  暂停：直接停掉游戏定时器，恢复时重新起；画面由动画循环照常刷新，
    //        所以能看到"已暂停"覆盖层。暂停不影响任何状态，可以无限次。
    //  结束本局：等价于蛇死亡——走正常的 endGame('fail') 流程，
    //        因此最高分、战绩、AI 进度等收尾逻辑和撞死完全一致。
    // ================================================================
    /**
     * 刷新工具栏上与"对局状态"有关的按钮：暂停 / 结束本局 / AI自动玩 / 重新开始。
     *
     * 规则按状态分，每个按钮各不相同：
     *
     *   状态          暂停   结束本局  AI自动玩  重新开始
     *   ────────────────────────────────────────────────
     *   开局提示      隐藏    隐藏      显示      隐藏
     *   手动游玩中    显示    显示      隐藏      隐藏
     *   AI 游玩中     显示    显示      隐藏      隐藏
     *   暂停 / 倒计时 显示    显示      显示      隐藏
     *   胜利界面      隐藏    隐藏      隐藏      显示   ← 工具栏只留「重新开始」
     *   本局结束      隐藏    隐藏      显示      显示
     *
     * 几处取舍：
     *  · **胜利界面期间工具栏只留「重新开始」**（横幅里则是「继续玩 / 返回」）：
     *    此刻工具栏再摆一排按钮会让人犹豫点哪个；留下「重新开始」是因为它是
     *    这时候最自然的下一步 —— 玩家不必先"返回"再重开。
     *  · 「AI自动玩」只在**没有对局在跑、且不在胜利界面**时出现（开局提示、
     *    暂停中、本局结束）。手动玩的时候点它会把当前这局直接顶掉，属于危险
     *    操作；AI 已经在跑时它更是彻底没用（处理函数开头就是 `if (aiMode) return;`）。
     *  · 游玩中不放「重新开始」：那一局还在跑，旁边常年摆一个"重新开始"很容易
     *    误触；真要走就点「结束本局」—— 它同样会把这一局记进战绩。
     *  · 结束之后反过来：已经没什么可"结束"的了，这时才出现「重新开始」；
     *    同时把暂停键收起来 —— 那一局已经结束，按"继续"也没有可继续的东西。
     *
     * 暂停键的**文案与高亮无论显隐都照常更新**（顺序：先算显示什么，再决定
     * 显不显示）。若在隐藏时直接 return，按钮会留着上一局的旧文案，下一局
     * 显示出来就是错的。
     */
    function updatePauseButton() {
        if (!pauseBtn) return;
        // 暂停键的文案与高亮：先算
        if (paused) {
            pauseBtn.innerText = '▶️ 继续';
            pauseBtn.classList.add('is-paused');
        } else {
            pauseBtn.innerText = '⏸️ 暂停';
            pauseBtn.classList.remove('is-paused');
        }
        // 再决定显隐
        const inRound = !!roundInProgress;              // 有一局正在跑
        const win = !!winScreenVisible;                 // 正停在胜利界面
        const over = !!gameOver && !win;                // 本局已结束（胜利界面另有按钮，不算在内）
        // 胜利界面期间暂停键也收起（横幅里已有「继续玩」，功能重复）
        pauseBtn.classList.toggle('is-hidden', !(inRound && !win));
        if (endBtn) endBtn.classList.toggle('is-hidden', !(inRound && !win));
        // AI 按钮：只在"没在跑、也不在胜利界面"时给（见上面注释里的取舍）
        if (aiBtn) aiBtn.classList.toggle('is-hidden', !(!inRound && !win));
        // 重新开始：本局结束后给；胜利界面期间也留着（工具栏里它是唯一的操作）
        if (restartBtn) restartBtn.classList.toggle('is-hidden', !(over || win));
    }

    // ================================================================
    //  恢复前的 3 秒倒计时
    // ----------------------------------------------------------------
    //  从「暂停」或「胜利界面」切回游戏时用。设计取舍：
    //   · 倒计时期间 paused 保持 true —— 这样 scheduleTick 里那道
    //     `if (gameOver || paused) return` 就是双保险，即使有残留的定时器
    //     也不会推进；逻辑只有一份，不用再造一个状态。
    //   · 不排 tick，画面由动画循环照常刷新，所以数字能动。
    //   · 空格与方向键在倒计时期间一律不响应（见键盘处理里的判断）。
    //   · 只在"从静止切回运行"时启动；开局提示（beginRound）不启动，
    //     因为那一屏本来就要求玩家按键才开始，再加倒计时是多余的。
    // ================================================================
    function startCountdown() {
        countdownEndsAt = Date.now() + COUNTDOWN_MS;
        countdownShownDigit = 0;
        // 顺手清掉"界面把我停住了"这个标记。它是给 continuePlaying 判断用的，
        // 到这里已经用完了；若留着，倒计时结束后 paused 会跟着变回 true，
        // 于是「已暂停」覆盖层又盖上来 —— 实测踩到过。
        winPausedByBanner = false;
        paused = true;                 // 倒计时期间不推进逻辑
        stopLoop();                    // 清掉可能还在排的 tick
        updatePauseButton();
        statusTip.innerText = '⏱️ 准备好了吗？' + (COUNTDOWN_MS / 1000) + ' 秒后开始';
        drawCanvas();
    }

    /** 倒计时是否正在进行。 */
    function countdownActive() {
        return countdownEndsAt > 0;
    }

    /** 由动画循环每帧调用：推进倒计时，到点后真正开始跑。 */
    function updateCountdown() {
        if (!countdownActive()) return;
        // 中途出现结束/达标界面时取消，避免它和那两个界面叠在一起
        if (gameOver || winScreenVisible || roundPending) {
            countdownEndsAt = 0;
            return;
        }
        const left = countdownEndsAt - Date.now();
        if (left <= 0) {
            countdownEndsAt = 0;
            countdownShownDigit = 0;
            winPausedByBanner = false;  // 双保险：确保不会画出「已暂停」覆盖层
            paused = false;            // 正式恢复
            updatePauseButton();
            clearStatus();
            statusTip.innerText = aiMode
                ? '🤖 AI 自动操作中（无需任何键盘输入）...'
                : '⬆️⬇️⬅️➡️ 方向键控制';
            startLoop();               // 从这里开始才推进逻辑
            drawCanvas();
        }
    }

    /** 取消倒计时（例如玩家点了「结束本局」）。 */
    function cancelCountdown() {
        countdownEndsAt = 0;
        countdownShownDigit = 0;
    }

    function togglePause() {
        if (gameOver) return;         // 已结束就没有暂停可言
        // 倒计时期间空格不响应：这时候按暂停没有意义，还会把倒计时搅乱
        if (countdownActive()) return;
        // 胜利界面显示时，空格/暂停键的含义是「继续玩」，不是「暂停/恢复」。
        // 少了这一条会出问题：togglePause 会把 paused 翻成 false，而胜利界面
        // 还在画（winScreenVisible 仍为 true），于是蛇在整屏遮罩底下继续走，
        // 玩家看不见 —— 实测复现过。
        if (winScreenVisible) {
            continuePlaying();
            return;
        }
        paused = !paused;
        if (paused) {
            stopLoop();
            statusTip.innerText = '⏸️ 已暂停 —— 按空格或点「继续」恢复';
            updatePauseButton();
            drawCanvas();
        } else {
            // 恢复时先走 3 秒倒计时，让玩家有时间把手指放回方向键上
            startCountdown();
        }
    }

    function finishRound() {
        if (gameOver) return;
        cancelCountdown();           // 倒计时中结束本局：先取消，别让它到点后又 startLoop
        // outcome 仍然是 'fail'（收尾路径与撞死完全一致，aiResult 的语义也不变），
        // 只多带一个标记说明"是玩家自己叫停的"，供战绩图标区分（🔄 而不是 💀）。
        endGame('你结束了本局', 'fail', true);
    }

    // ================================================================
    //  键盘事件（仅手动模式有效，空格始终可暂停）
    // ================================================================
    document.addEventListener('keydown', (e) => {
        const key = e.key;

        // 空格：一个键三种含义，按状态分。
        // 放在最前面，且不受"AI 接管"影响 —— AI 跑起来之后更需要能随时暂停。
        if (key === ' ' || key === 'Spacebar' || e.code === 'Space') {
            e.preventDefault();
            if (e.repeat) return;            // 按住不放只触发一次
            // ① 开局提示期间 -> "开始"
            if (roundPending) {
                beginRound();
                return;
            }
            // ② 胜利界面期间 -> "继续玩"（togglePause 里已有这条分支，交给它）
            if (winScreenVisible) {
                togglePause();
                return;
            }
            // ③ 本局已结束 -> "重新开始"。
            //    结束时暂停键已经收起，此时空格按下去本来什么都不会发生；
            //    给它"重新开始"的含义，死了想再来一局就不必去够鼠标。
            if (gameOver) {
                restartFromBanner();
                return;
            }
            // ④ 其余情况 -> 暂停 / 恢复
            togglePause();
            return;
        }

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
            e.preventDefault();
        }
        if (gameOver || aiMode) return;   // AI 接管或已结束时忽略方向键
        if (roundPending) return;         // 还没开始，转向没有意义
        // 倒计时期间不接受转向：这时候画面还没开始跑，按了也看不到反馈，
        // 而且会让人误以为"已经开始了"。等数字走完再允许操作。
        if (countdownActive()) return;
        // 暂停时不接受转向：否则恢复后会看到一个"多出来"的转向
        if (paused) return;

        switch (key) {
            case 'ArrowUp':    if (direction !== 'down')  nextDirection = 'up'; break;
            case 'ArrowDown':  if (direction !== 'up')    nextDirection = 'down'; break;
            case 'ArrowLeft':  if (direction !== 'right') nextDirection = 'left'; break;
            case 'ArrowRight': if (direction !== 'left')  nextDirection = 'right'; break;
            default: return;
        }
    });

    // 开局提示上写着"点这里开始"，所以点画面也要能开始
    canvas.addEventListener('click', () => {
        if (roundPending) beginRound();
    });
    // 提示层是"点画面开始"，给鼠标用户一个明确的可点光标
    canvas.addEventListener('mousemove', () => {
        canvas.style.cursor = roundPending ? 'pointer' : 'default';
    });

    // ================================================================
    //  AI 按钮逻辑
    // ================================================================
    function startAI() {
        if (aiMode) return;
        // 开一局干净的，然后交给 AI
        initGame();
        roundPending = false;      // AI 演示不经过开局提示，直接跑
        roundInProgress = true;
        // 先把 aiMode 置好，再刷新按钮 —— 顺序反了的话，下面那次刷新读到的
        // aiMode 还是 false，「AI自动玩」按钮就会继续显示着（而 AI 明明已经在跑）。
        // 同理，initGame() 内部是先 hideWinBanner()（会刷新按钮）再把 roundPending
        // 置回 true 的，所以这行之后也必须再刷新一次，否则暂停键会停在"隐藏"状态。
        aiMode = true;
        updatePauseButton();
        aiResult = null;
        foodEatenCount = 0;
        statusTip.innerText = '🤖 AI 自动操作中（无需任何键盘输入）...';
        // 只报已吃数量，不设上限：这局会一直玩到铺满全盘为止
        aiProgress.innerText = '🍽️ 0';
        startLoop();
        moveSnake();
    }

    document.getElementById('aiBtn').addEventListener('click', () => {
        startAI();
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
        togglePause();
    });

    document.getElementById('endBtn').addEventListener('click', () => {
        finishRound();
    });

    // 胜利提示上的选择：继续玩。
    // 「重新开始」就是紧挨着它左边那个工具栏按钮，restartFromBanner()
    // 也照旧由它（以及死亡界面上的空格键）调用。
    document.getElementById('continueBtn').addEventListener('click', () => {
        continuePlaying();
    });

    // ================================================================
    //  主题切换（新增功能之一：至少 2 套配色，切换即时生效，刷新保留）
    // ================================================================
    function applyTheme(theme) {
        currentTheme = theme;
        safeSet('snakeTheme', theme);
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        // 按钮说的是"点下去会变成什么"，不是"当前是什么"：
        // 日间模式点它切到夜间 -> 显示「🌙 切换夜间模式」；夜间模式反过来。
        // 所以文案要跟着当前主题走，放在 applyTheme 里最稳 ——
        // 启动读 localStorage、点按钮、以后若有别的入口，都走这一条路径。
        if (themeBtn) {
            themeBtn.innerText = (theme === 'dark')
                ? '🌞️ 切换日间模式'
                : '🌙 切换夜间模式';
        }
        // 启动时 applyTheme 会在 initGame 之前被调用，那时 snake 还是空的。
        // drawCanvas 本身已经能安全返回，这里再判一次是为了把意图写明白：
        // 设置主题不必强制重绘，真正需要重绘的是"用户点主题按钮"这条路径。
        if (snake.length) drawCanvas();
    }

    themeBtn.addEventListener('click', () => {
        applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    });

    // ================================================================
    //  工具栏的「重新开始」
    // ----------------------------------------------------------------
    //  玩到一半点它会**先把这一局记进战绩**（分数、局数都算），再去开局提示；
    //  停在开局提示上点它则什么都不记 —— 那一局根本没开始过。
    //  这也是为什么需要 roundInProgress 这个状态：光看 gameOver/roundPending
    //  分不出"有一局正在跑"和"还没开始"。
    // ================================================================
    document.getElementById('restartBtn').addEventListener('click', () => {
        if (roundInProgress) {
            const wasAI = aiMode;
            // outcome 记 'fail'（这一局没走完），另外标一句"玩家自己叫停"。
            // 注意顺序：recordRound 读的是当前的 score，所以必须在
            // startNewRoundWithPrompt()（内部会 initGame 把 score 清零）之前调用。
            recordRound('fail', '玩到一半重新开始', wasAI, true);
        }
        startNewRoundWithPrompt();
    });

    // ================================================================
    //  启动
    // ================================================================
    function bootstrap() {
        highScore = parseInt(safeGet('snakeHighScore') || '0', 10) || 0;
        highScoreSpan.innerText = highScore;

        loadHistory();
        renderHistory();

        // 累计局数：与最高分同样对待，从 localStorage 读回来
        roundCount = parseInt(safeGet('snakeRoundCount') || '0', 10) || 0;
        updateRoundCountDisplay();

        // 顺序要紧：先 applyTheme 把 data-theme 属性设好（它内部不再重绘，
        // 而且此刻还没有蛇），再 initGame() —— initGame 结尾会 drawCanvas()，
        // 那时主题已经正确、蛇也已经就位。早先的写法是 initGame 在 applyTheme
        // 之后，而 applyTheme 会立刻重绘，导致空蛇被绘制并抛错、打断整个启动。
        applyTheme(safeGet('snakeTheme') === 'dark' ? 'dark' : 'light');

        initGame();
        assertCycleRoute();   // 自检：回路常量与初始蛇形是否自洽

        // 首个动画循环要先起来：开局提示层上的"按空格开始"有呼吸效果，
        // 而此刻游戏逻辑循环（startLoop）是**故意不启动**的。
        startAnim();

        // 开局停在提示界面上，按空格或点画面才开始。startLoop 由 beginRound() 负责。
        showRoundPrompt();
    }

    window.onload = bootstrap;
</script>
</body>
</html>
